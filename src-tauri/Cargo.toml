[package]
name = "localplayer"
version = "0.5.9"
description = "LocalPlayer — player de vídeo/áudio minimalista 100% offline (motor mpv)"
authors = ["Taylor"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Anon5T4R/LocalPlayer"

[lib]
# O sufixo `_lib` evita conflito entre o nome da lib e o do binário no Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "localplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset`: as <img> das miniaturas da timeline saem do cache em
# app_data/thumbs via asset: (escopo de RUNTIME, só essa pasta — thumbs.rs).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Embed do vídeo no Windows: cria uma child window nativa sob a janela do Tauri
# e passa o HWND dela pro mpv via `--wid`. Só no Windows — no Linux o mpv abre
# em janela própria (Plano B), então nada disso entra no build do CI Ubuntu.
# winapi (não a crate `windows`) de propósito: assinaturas C estáveis e simples
# pra CreateWindowExW/SetWindowPos — menos superfície pra erro.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser",
    "libloaderapi",
    "windef",
    "minwindef",
    "fileapi",
    "namedpipeapi",
    "handleapi",
    "winnt",
    "winbase",
    "errhandlingapi",
] }

# Vídeo dentro da janela no Linux (Plano A também aqui).
#
# No Windows o embed é por `--wid`: o mpv reparenteia sua janela dentro da
# nossa. No Wayland isso NÃO EXISTE — o protocolo não permite um processo
# enfiar sua superfície na janela de outro, e nenhum player resolve isso
# (a libVLC tem a mesma limitação, via `--drawable-xid`).
#
# A saída é não usar janela nenhuma: o mpv entra como BIBLIOTECA e desenha os
# frames num FBO que nós controlamos, dentro de um GtkGLArea da própria janela.
# É o desenho que o Celluloid usa, e funciona igual em Wayland e X11.
#
# `libmpv` vem do SISTEMA (pacote `mpv`/`libmpv-dev`), não empacotado: é o mesmo
# critério das outras libs que falam com driver de GPU — quem tem que casar com
# o Mesa da máquina é a lib da máquina.
[target.'cfg(target_os = "linux")'.dependencies]
libmpv2 = "6"
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
# Para resolver simbolos de OpenGL pro mpv. O GTK ja carregou a libepoxy no
# processo, entao `dlsym(RTLD_DEFAULT)` acha os mesmos simbolos que o GtkGLArea
# usa — sem um segundo carregador, que e onde nasceria a tela preta silenciosa.
libc = "0.2"
